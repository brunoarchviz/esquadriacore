# MANIFESTO_ACERVO — inventário do Acervo Compartilhado (Google Drive).
#
# Arquitetura (handoff 2026-08-15, seção 22): Drive guarda os binários; este
# arquivo + acervo/manifesto.py são a autoridade em Git; o cache local é cópia
# reconstruível. Ler acervo/manifesto.py para o schema e o validador.
#
# CONVENÇÃO DESTA RODADA — presente_no_drive:
# `drive_file_id` é o localizador primário do item (seção 24 do handoff);
# `caminho_drive` é só diagnóstico/humano. Nenhum drive_file_id foi coletado
# nesta primeira leva (infra do manifesto, não varredura do Drive), então
# `presente_no_drive` fica `false` em TODO item abaixo — mesmo nos que o
# handoff descreve como fisicamente presentes no Drive. Isto não deve ser lido
# como "ausente do Drive": é "localizador ainda não capturado nesta rodada".
# NÃO ENCONTRADO != NÃO EXISTE. Ver `pontos_cegos_conhecidos`.
#
# Esta é uma primeira leva seletiva (handoff seção 23, item 9): NÃO cadastra
# os 266 arquivos do cache — só os itens/coleções de maior valor e estado
# claro que o handoff nomeia explicitamente.

