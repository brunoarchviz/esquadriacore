# MANIFESTO_ACERVO — inventário do Acervo Compartilhado (Google Drive).
#
# Arquitetura (handoff 2026-08-15, seção 22): Drive guarda os binários; este
# arquivo + acervo/manifesto.py são a autoridade em Git; o cache local é cópia
# reconstruível. Ler acervo/manifesto.py para o schema e o validador.
#
# presente_no_drive / drive_file_id (corrigido na auditoria pré-merge da PR
# #16 — versão anterior desta nota dizia que TODO item ficava
# presente_no_drive=false por falta de drive_file_id; isso confundia
# "localizador não coletado" com "ausente do Drive", o que é o próprio erro
# que NÃO ENCONTRADO != NÃO EXISTE existe para evitar):
# os 12 itens abaixo foram confirmados via `rclone lsjson` (read-only,
# remote esquadriacore_drive) em 2026-08-15 — presentes, com drive_file_id e
# caminho_drive reais. Nenhum arquivo foi baixado, copiado, movido nem
# alterado; só listagem.
#
# Esta é uma primeira leva seletiva (handoff seção 23, item 9): NÃO cadastra
# os 266 arquivos do cache — só os itens/coleções de maior valor e estado
# claro que o handoff nomeia explicitamente.

versao_manifesto: 1

ultima_varredura:
  data: "2026-08-15"
  locais_cobertos:
    - "ESQUADRIACORE_HANDOFF_OFICIAL_POS_ACERVO_2026-08-15.md (seções 10-22)"
    - "repositório Git em HEAD 8aa46ad3d1070e1a5ad4df88905d0b6fc6651208"
    - "rclone lsjson (read-only) contra o remote esquadriacore_drive: raiz, 01_FONTES_PRIMARIAS/{catalogos_fabricantes/ALCOA,catalogos_fabricantes/ALCOA/EDICOES_PACRE,catalogos_fabricantes/CENTENARIO,evidencias_campo}, 02_BASES_TECNICAS/dados_auxiliares/material_didatico/vidraceiro_rico, 03_ARTEFATOS_HOMOLOGADOS — confirma os 12 itens semeados"
  pontos_cegos_conhecidos:
    - "266 arquivos do cache Drive não foram individualmente inventariados; apenas os itens/coleções de maior valor listados no handoff foram semeados"
    - "~/Downloads/catalago-alcoa.pdf (candidato de faxina futura, possível relação com dados_exemplo/catalago-alcoa (1).pdf) não avaliado aqui — sem SHA-256 comparado"
    - "sha256 de L25/L30 não foi reconferido contra os bytes reais nesta rodada — só o formato (64 hex) do valor já registrado; verificação física de bytes é outra rodada (mesma separação estrutural×física de composicao/proveniencia.py)"
    - "mtime_origem e hash_calculado_em permanecem null em todo item — o ModTime que o rclone lsjson devolve é metadado do Drive, não confirmadamente o mtime do arquivo de origem, e não foi promovido a mtime_origem por essa incerteza"

