# Manifesto de proveniência — SUPREMA_CORRER_2F
#
# O QUE ESTE ARQUIVO É
# Registro de METADADOS das evidências primárias: rótulo do acervo, caminho
# relativo, sha256 e tamanho, mais as afirmações que essas evidências
# sustentam e com que papel. Nenhum byte do acervo bruto está aqui.
#
# O QUE ESTE ARQUIVO NÃO É
# Não é receita técnica: não tem componente, papel de peça, regra dimensional,
# fórmula nem resultado. Não abre gate de cálculo nem de produção.
#
# ONDE ESTÁ O ACERVO
# Fora do repositório, de propósito (21 MB). O caminho físico é de quem roda:
#   export ESQUADRIACORE_ACERVO_SUPREMA_CORRER_2F=/caminho/do/acervo
#   python -m composicao.cli verificar-acervo composicao/insumos/proveniencia_suprema_2f.yaml
# Nenhum caminho absoluto de máquina entra neste arquivo.
#
# LIMITE DE PROVA QUE NÃO PODE SER ESCONDIDO
# Nenhuma das 78 fotos mostra código SU legível. Uma foto prova que existe uma
# peça naquela posição; quem NOMEIA a peça é a ficha de campo; a arbitragem
# consolida. Por isso quase nenhuma foto aparece como DIRETA para afirmação de
# código de perfil — aparece como CORROBORATIVA.
#
# COMO REGERAR O BLOCO `artefatos`
#   python -m composicao.cli inventariar-acervo <raiz-fisica> \
#       --raiz-logica SUPREMA_CORRER_2F

versao_manifesto: 1
conjunto: SUPREMA_CORRER_2F
raiz_logica: SUPREMA_CORRER_2F
descricao: >-
  Evidências primárias da janela Suprema de correr de duas folhas: três janelas
  reais fotografadas, ficha de levantamento de campo, benchmark externo Wvetro
  de um projeto DIFERENTE (1500x1200) e material do sistema anterior VidroSys.
  112 artefatos, 22.401.782 bytes, 112 sha256 distintos.

# ---------------------------------------------------------------------------
# Grupos — a semântica mora aqui, não no scanner de arquivos
# ---------------------------------------------------------------------------
grupos:
  - grupo: 01_ficha_campo
    tipo: registro_de_campo
    estado: CONFIRMADO_CASO_REAL
    abrangencia: COMPARTILHADA
    responsavel: Bruno
    data: '2026-08-09'
    descricao: >-
      REGISTRO PRIMÁRIO DE CAMPO. Ficha preenchida durante o levantamento, na
      frente das janelas — é evidência primária pela origem, não fotografia.
      Declarada COMPARTILHADA porque uma única ficha cobre os três exemplares:
      ela prova que alguém mediu as três, não distingue uma da outra. Essa
      distinção é de ABRANGÊNCIA; a natureza primária permanece. É a única
      fonte que NOMEIA os perfis (SU-0xx), porque nenhuma foto mostra código
      legível. A seção 10 (Evidências e anexos) está em branco no bruto: o
      vínculo foto -> afirmação não existia e é criado aqui, como curadoria.

