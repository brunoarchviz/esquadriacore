notas:
  - >-
    TMS001 versus SU-001: o Wvetro escreve TMS001 para o marco superior e nunca
    SU001. A única equivalência SU/TMS homologada no projeto é SU-102 x TMS-102.
    TMS001 é preservado literalmente e NENHUMA associação TMS001 -> SU-001 foi
    criada, nem alias, nem equivalência implícita. Pendente de arbitragem
    futura; não é objeto desta rodada.
  - >-
    O projeto Wvetro é 1500x1200 e não corresponde a nenhuma das três janelas
    fotografadas (2015x740, 1972x1134, 2203x1160). Ele pode corroborar
    estrutura e quantidade em um caso externo distinto; não prova nada sobre as
    janelas deste acervo.
  - >-
    Reemissões do Wvetro: existem SEIS pares "X.pdf" / "X (1).pdf" com bytes
    diferentes, não cinco como registrado no handoff da Rodada 1 — o sexto par
    é Orcamento_Acessorios_Fonecedor.pdf.pdf / Orcamento_Acessorios_Fonecedor.pdf (1).pdf,
    de extensão dupla. Todos os doze arquivos estão registrados como artefatos
    DISTINTOS, com sha256 próprio. Nenhum foi escolhido como "o correto".
  - >-
    O padrão "X (1)" também ocorre em 15 pares de FOTOS (03_janela_media,
    04_janela_grande e quadro_sem_folhas). Ali a diferença de tamanho chega a
    +61%, incompatível com reemissão do mesmo arquivo: são provavelmente fotos
    distintas com colisão de nome do WhatsApp. Todas registradas como artefatos
    distintos. Política definitiva pendente de arbitragem (ARB-7).
  - >-
    Nenhuma das 78 fotos tem EXIF — o WhatsApp removeu. O único fingerprint
    disponível é o sha256, e é por isso que ele é obrigatório em todo artefato
    externo deste manifesto.
  - >-
    Nenhuma fórmula dimensional foi registrada aqui. L-32, H-5, H-55 e
    (L-132)/2 continuam candidatas da ficha, não regra do projeto.

