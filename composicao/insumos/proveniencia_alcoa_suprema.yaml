  - identificador: CAT-12
    texto: >-
      O SUP JCR 200A é uma montagem distinta do SUP JCR 200, também descrita
      como "Janela de correr 2 folhas", e emprega os perfis SU-026, SU-028,
      SU-251 e SU-291, que não aparecem no SUP JCR 200.
    estado: CONFIRMADO_CATALOGO
    observacao: >-
      Importante contra confusão de família: "Suprema de correr 2 folhas" não
      designa uma montagem única no catálogo. As duas compartilham SU-039,
      SU-040, SU-041, SU-053 e SU-102, e diferem nos perfis de marco.
    citacoes:
      - id_fonte: FONTE-ALCOA-LINHA-SUPREMA-PDF
        papel: DIRETA
        localizador:
          pagina_documento: 118
          pagina_pdf: 114
          secao: SUP JCR 200A

# ---------------------------------------------------------------------------
# Notas
# ---------------------------------------------------------------------------
notas:
  - >-
    Nenhuma fórmula de corte foi encontrada nas páginas inspecionadas nesta
    ingestão. Isso NÃO afirma que o catálogo inteiro não contenha nenhuma: as
    135 páginas não foram todas lidas visualmente.
  - >-
    O deslocamento entre folha impressa e página do PDF NÃO é constante neste
    documento (-3 na região dos perfis, -4 na região das montagens). Registrar
    apenas uma das duas páginas mandaria conferir a folha errada.
  - >-
    O catálogo dá nomes de PAPEL aos perfis ("Marco superior", "Travessa da
    folha"). Esses nomes são do fabricante e descrevem o perfil no catálogo;
    não são, por si, prova de qual peça ocupa qual posição numa janela real
    medida em campo.

