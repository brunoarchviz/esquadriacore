          pagina_pdf: 68
          secao: Perfis

  - identificador: CAT-11
    texto: >-
      A prancha do SUP JCR 200 traz impressas as cotas L, H, H-50, H-134,
      (L-131,2)/2 e (L-143,2)/2, esta última rotulada "Vidro".
    estado: CONFIRMADO_CATALOGO
    observacao: >-
      REGISTRO CRU DAS COTAS, sem interpretação. Esta afirmação NÃO diz o que
      cada cota mede, NÃO afirma que L e H são o quadro, NÃO deriva folga de
      vidro e NÃO estabelece comprimento de corte de perfil nenhum. Determinar
      a que geometria cada cota se refere exige rastrear as linhas de cota no
      desenho, e essa leitura não é texto do fabricante — fica fora deste
      manifesto por decisão explícita.
    citacoes:
      - id_fonte: FONTE-ALCOA-LINHA-SUPREMA-PDF
        papel: DIRETA
        localizador:
          pagina_documento: 117
          pagina_pdf: 113
